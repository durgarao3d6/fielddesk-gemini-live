[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "fielddesk-gemini-live"
version = "0.1.0"
description = "Gemini Live maintenance dispatch for field technicians"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["websockets>=15,<17"]

[project.scripts]
fielddesk = "fielddesk.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fielddesk = ["fixtures/*.json", "web/*.html"]
